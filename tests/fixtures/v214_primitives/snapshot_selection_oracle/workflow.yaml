{
  "version": "2.7",
  "name": "v214-snapshot-selection-oracle",
  "outputs": {
    "selected_variant": {
      "kind": "scalar",
      "type": "enum",
      "allowed": [
        "COMPLETED",
        "BLOCKED"
      ],
      "from": {
        "ref": "root.steps.SelectChangedCandidate.artifacts.selected_variant"
      }
    }
  },
  "steps": [
    {
      "name": "InitializeCandidateSnapshot",
      "command": [
        "python",
        "-c",
        "import hashlib\nimport json\nimport pathlib\n\ndef sha256(path: pathlib.Path) -> str:\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\nartifacts_root = pathlib.Path(\"artifacts/work\")\nartifacts_root.mkdir(parents=True, exist_ok=True)\nexecution_path = artifacts_root / \"execution_report.md\"\nprogress_path = artifacts_root / \"progress_report.md\"\nexecution_path.write_text(\"baseline execution report\\n\", encoding=\"utf-8\")\nprogress_path.write_text(\"baseline progress report\\n\", encoding=\"utf-8\")\n\npathlib.Path(\"state/oracle\").mkdir(parents=True, exist_ok=True)\npathlib.Path(\"state/oracle/pre_snapshot.json\").write_text(\n    json.dumps(\n        {\n            \"snapshot_candidate_keys\": [\n                \"execution_report_path\",\n                \"progress_report_path\",\n            ],\n            \"candidates\": {\n                \"execution_report_path\": {\n                    \"path\": execution_path.as_posix(),\n                    \"sha256\": sha256(execution_path),\n                },\n                \"progress_report_path\": {\n                    \"path\": progress_path.as_posix(),\n                    \"sha256\": sha256(progress_path),\n                },\n            },\n        },\n        indent=2,\n    )\n    + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ]
    },
    {
      "name": "MutateCandidateSnapshot",
      "command": [
        "python",
        "-c",
        "import json\nimport pathlib\n\nscenario = json.loads(pathlib.Path(\"state/fake_provider_scenario.json\").read_text(encoding=\"utf-8\"))\nmode = scenario[\"mode\"]\nexecution_path = pathlib.Path(\"artifacts/work/execution_report.md\")\nprogress_path = pathlib.Path(\"artifacts/work/progress_report.md\")\n\nif mode in {\"single_changed\", \"multi_change\"}:\n    execution_path.write_text(\"updated execution report\\n\", encoding=\"utf-8\")\nif mode == \"multi_change\":\n    progress_path.write_text(\"updated progress report\\n\", encoding=\"utf-8\")\n"
      ]
    },
    {
      "name": "SelectChangedCandidate",
      "command": [
        "python",
        "-c",
        "import hashlib\nimport json\nimport pathlib\n\ndef sha256(path: pathlib.Path) -> str:\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\nstate_root = pathlib.Path(\"state/oracle\")\npre_snapshot = json.loads((state_root / \"pre_snapshot.json\").read_text(encoding=\"utf-8\"))\ncandidates = pre_snapshot[\"candidates\"]\nchanged = []\ncurrent_hashes = {}\nfor key in sorted(candidates):\n    relpath = candidates[key][\"path\"]\n    digest = sha256(pathlib.Path(relpath))\n    current_hashes[key] = digest\n    if digest != candidates[key][\"sha256\"]:\n        changed.append(key)\n\nif len(changed) != 1:\n    failure_class = \"no_changed_candidates\" if not changed else \"multiple_changed_candidates\"\n    (state_root / \"snapshot_selection_error.json\").write_text(\n        json.dumps(\n            {\n                \"failure_class\": failure_class,\n                \"snapshot_candidate_keys\": pre_snapshot[\"snapshot_candidate_keys\"],\n                \"changed_candidate_keys\": changed,\n                \"current_hashes\": current_hashes,\n            },\n            indent=2,\n        )\n        + \"\\n\",\n        encoding=\"utf-8\",\n    )\n    raise SystemExit(failure_class)\n\nselected_key = changed[0]\nselected_variant = \"COMPLETED\" if selected_key == \"execution_report_path\" else \"BLOCKED\"\nselected_path = candidates[selected_key][\"path\"]\n(state_root / \"snapshot_selection.json\").write_text(\n    json.dumps(\n        {\n            \"selected_variant\": selected_variant,\n            \"selected_path\": selected_path,\n            \"snapshot_candidate_keys\": pre_snapshot[\"snapshot_candidate_keys\"],\n            \"changed_candidate_keys\": changed,\n            \"current_hashes\": current_hashes,\n        },\n        indent=2,\n    )\n    + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ],
      "output_bundle": {
        "path": "state/oracle/snapshot_selection.json",
        "fields": [
          {
            "name": "selected_variant",
            "json_pointer": "/selected_variant",
            "type": "enum",
            "allowed": [
              "COMPLETED",
              "BLOCKED"
            ]
          },
          {
            "name": "selected_path",
            "json_pointer": "/selected_path",
            "type": "relpath",
            "under": "artifacts/work",
            "must_exist_target": true
          }
        ]
      }
    }
  ]
}
