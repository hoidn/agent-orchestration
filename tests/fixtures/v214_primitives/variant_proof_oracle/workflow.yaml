{
  "version": "2.7",
  "name": "v214-variant-proof-oracle",
  "outputs": {
    "selected_variant": {
      "kind": "scalar",
      "type": "enum",
      "allowed": [
        "COMPLETED"
      ],
      "from": {
        "ref": "root.steps.EnforceVariantProof.artifacts.selected_variant"
      }
    }
  },
  "steps": [
    {
      "name": "EmitVariantBundle",
      "command": [
        "python",
        "-c",
        "import json\nimport pathlib\n\nscenario = json.loads(pathlib.Path(\"state/fake_provider_scenario.json\").read_text(encoding=\"utf-8\"))\nartifacts_root = pathlib.Path(\"artifacts/work\")\nartifacts_root.mkdir(parents=True, exist_ok=True)\nstate_root = pathlib.Path(\"state/oracle\")\nstate_root.mkdir(parents=True, exist_ok=True)\n\nif scenario[\"mode\"] == \"variant_proof_accept\":\n    execution_path = artifacts_root / \"execution_report.md\"\n    execution_path.write_text(\"# Execution Report\\n\", encoding=\"utf-8\")\n    payload = {\n        \"implementation_state\": \"COMPLETED\",\n        \"execution_report_path\": execution_path.as_posix(),\n    }\nelse:\n    progress_path = artifacts_root / \"progress_report.md\"\n    progress_path.write_text(\"# Blocked Progress Report\\n\\nBlocker Class: missing_resource\\n\", encoding=\"utf-8\")\n    payload = {\n        \"implementation_state\": \"BLOCKED\",\n        \"progress_report_path\": progress_path.as_posix(),\n        \"blocker_class\": \"missing_resource\",\n    }\n\n(state_root / \"variant_bundle.json\").write_text(\n    json.dumps(payload, indent=2) + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ],
      "output_bundle": {
        "path": "state/oracle/variant_bundle.json",
        "fields": [
          {
            "name": "implementation_state",
            "json_pointer": "/implementation_state",
            "type": "enum",
            "allowed": [
              "COMPLETED",
              "BLOCKED"
            ]
          },
          {
            "name": "execution_report_path",
            "json_pointer": "/execution_report_path",
            "type": "relpath",
            "under": "artifacts/work",
            "must_exist_target": true,
            "required": false
          },
          {
            "name": "progress_report_path",
            "json_pointer": "/progress_report_path",
            "type": "relpath",
            "under": "artifacts/work",
            "must_exist_target": true,
            "required": false
          },
          {
            "name": "blocker_class",
            "json_pointer": "/blocker_class",
            "type": "enum",
            "allowed": [
              "missing_resource",
              "unavailable_hardware",
              "roadmap_conflict",
              "external_dependency_outside_authority",
              "user_decision_required",
              "unrecoverable_after_fix_attempt"
            ],
            "required": false
          }
        ]
      }
    },
    {
      "name": "EnforceVariantProof",
      "command": [
        "python",
        "-c",
        "import json\nimport pathlib\n\nbundle = json.loads(pathlib.Path(\"state/oracle/variant_bundle.json\").read_text(encoding=\"utf-8\"))\nselected_variant = bundle[\"implementation_state\"]\nrequired_variant = \"COMPLETED\"\nrequested_field = \"execution_report_path\"\n\nif selected_variant != required_variant:\n    pathlib.Path(\"state/oracle/variant_access_error.json\").write_text(\n        json.dumps(\n            {\n                \"failure_class\": \"variant_unavailable\",\n                \"selected_variant\": selected_variant,\n                \"required_variant\": required_variant,\n                \"requested_field\": requested_field,\n            },\n            indent=2,\n        )\n        + \"\\n\",\n        encoding=\"utf-8\",\n    )\n    raise SystemExit(\n        f\"variant_unavailable: {requested_field} requires {required_variant}, got {selected_variant}\"\n    )\n\npathlib.Path(\"state/oracle/variant_access.json\").write_text(\n    json.dumps(\n        {\n            \"selected_variant\": selected_variant,\n            \"requested_field\": requested_field,\n            \"accessed_path\": bundle[requested_field],\n        },\n        indent=2,\n    )\n    + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ],
      "output_bundle": {
        "path": "state/oracle/variant_access.json",
        "fields": [
          {
            "name": "selected_variant",
            "json_pointer": "/selected_variant",
            "type": "enum",
            "allowed": [
              "COMPLETED"
            ]
          },
          {
            "name": "accessed_path",
            "json_pointer": "/accessed_path",
            "type": "relpath",
            "under": "artifacts/work",
            "must_exist_target": true
          }
        ]
      }
    }
  ]
}
