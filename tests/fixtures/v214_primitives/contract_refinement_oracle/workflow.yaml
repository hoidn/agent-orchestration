{
  "version": "2.7",
  "name": "v214-contract-refinement-oracle",
  "outputs": {
    "refinement_status": {
      "kind": "scalar",
      "type": "enum",
      "allowed": [
        "ACCEPTED"
      ],
      "from": {
        "ref": "root.steps.ValidateContractRefinement.artifacts.refinement_status"
      }
    }
  },
  "steps": [
    {
      "name": "SeedSourceContract",
      "command": [
        "python",
        "-c",
        "import json\nimport pathlib\n\npathlib.Path(\"state\").mkdir(parents=True, exist_ok=True)\npathlib.Path(\"state/source_contract.json\").write_text(\n    json.dumps(\n        {\n            \"type\": \"relpath\",\n            \"under\": \"docs\",\n            \"must_exist_target\": False,\n            \"allowed\": [\"plan\", \"review\", \"implementation\"],\n        },\n        indent=2,\n    )\n    + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ]
    },
    {
      "name": "ValidateContractRefinement",
      "command": [
        "python",
        "-c",
        "import json\nimport pathlib\n\ndef under_is_narrower(source_under: str, proposed_under: str) -> bool:\n    return proposed_under == source_under or proposed_under.startswith(source_under + \"/\")\n\nstate_root = pathlib.Path(\"state\")\nscenario = json.loads((state_root / \"fake_provider_scenario.json\").read_text(encoding=\"utf-8\"))\nsource = json.loads((state_root / \"source_contract.json\").read_text(encoding=\"utf-8\"))\n\nproposals = {\n    \"stricter_contract\": {\n        \"type\": \"relpath\",\n        \"under\": \"docs/plans\",\n        \"must_exist_target\": True,\n        \"allowed\": [\"plan\"],\n    },\n    \"weaker_contract\": {\n        \"type\": \"relpath\",\n        \"under\": \"docs\",\n        \"must_exist_target\": False,\n        \"allowed\": [\"plan\", \"review\", \"implementation\", \"extra\"],\n    },\n}\n\nproposal = proposals[scenario[\"mode\"]]\nviolations = []\nif proposal[\"type\"] != source[\"type\"]:\n    violations.append(\"type changed\")\nif source[\"must_exist_target\"] and not proposal[\"must_exist_target\"]:\n    violations.append(\"must_exist_target weakened\")\nif not under_is_narrower(source[\"under\"], proposal[\"under\"]):\n    violations.append(\"under moved outside source scope\")\nif not set(proposal[\"allowed\"]).issubset(set(source[\"allowed\"])):\n    violations.append(\"allowed set expanded\")\n\nif violations:\n    (state_root / \"contract_refinement_error.json\").write_text(\n        json.dumps(\n            {\n                \"result\": \"REJECTED\",\n                \"violation_type\": \"contract_refinement_weakened\",\n                \"violations\": violations,\n                \"source_contract\": source,\n                \"proposal\": proposal,\n            },\n            indent=2,\n        )\n        + \"\\n\",\n        encoding=\"utf-8\",\n    )\n    raise SystemExit(\"; \".join(violations))\n\nplan_path = pathlib.Path(\"docs/plans/oracle-refined-plan.md\")\nplan_path.parent.mkdir(parents=True, exist_ok=True)\nplan_path.write_text(\"# Refined Oracle Plan\\n\", encoding=\"utf-8\")\n(state_root / \"contract_refinement.json\").write_text(\n    json.dumps(\n        {\n            \"refinement_status\": \"ACCEPTED\",\n            \"plan_path\": plan_path.as_posix(),\n            \"source_contract\": source,\n            \"proposal\": proposal,\n        },\n        indent=2,\n    )\n    + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ],
      "output_bundle": {
        "path": "state/contract_refinement.json",
        "fields": [
          {
            "name": "refinement_status",
            "json_pointer": "/refinement_status",
            "type": "enum",
            "allowed": [
              "ACCEPTED"
            ]
          },
          {
            "name": "plan_path",
            "json_pointer": "/plan_path",
            "type": "relpath",
            "under": "docs/plans",
            "must_exist_target": true
          }
        ]
      }
    }
  ]
}
