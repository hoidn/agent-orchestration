{
  "version": "2.7",
  "name": "v214-invalid-bundle-oracle",
  "steps": [
    {
      "name": "EmitInvalidBundle",
      "command": [
        "python",
        "-c",
        "import json\nimport pathlib\n\npathlib.Path(\"state\").mkdir(parents=True, exist_ok=True)\npathlib.Path(\"state/invalid_selection.json\").write_text(\n    json.dumps({\"selection_status\": \"MAYBE\"}, indent=2) + \"\\n\",\n    encoding=\"utf-8\",\n)\n"
      ],
      "output_bundle": {
        "path": "state/invalid_selection.json",
        "fields": [
          {
            "name": "selection_status",
            "json_pointer": "/selection_status",
            "type": "enum",
            "allowed": [
              "SELECTED",
              "DONE",
              "BLOCKED"
            ]
          }
        ]
      }
    }
  ]
}
