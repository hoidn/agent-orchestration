[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
lsp = [
    "pygls>=2.1.1,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.experiments.schemas" = ["*.json"]
"orchestrator.providers.schemas" = ["*.json"]
"orchestrator.workflow_lisp" = ["stdlib_modules/**/*.orc"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that may require network or secrets; skipped by default",
    "requires_secrets: tests that require secrets; must skip when secrets are absent",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
